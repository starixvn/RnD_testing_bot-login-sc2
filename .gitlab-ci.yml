image: 
  name: git3.nexdev.net:5050/rnd/testing/bot-login-sc2

stages: 
  - test
  - after-test
  - cleanup

login-test:
  stage: test
  tags:
   - docker-automation-test
  script:
   - npm install
   - set NODE_ENV=cf_prod
   - npm run test
  artifacts:
    paths:
      - Report/Pictures/
    when: always
    expire_in: 1 day 

    
after-test-f:
  stage: after-test
  tags:
  - docker-automation-test
  script:
    - curl --data-urlencode "message=**CI Job 「Check Login SC2」..:rocket:**{{NewLine}}**:no_entry:FAILED:no_entry:** - [Evidence](https://git3.nexdev.net/RnD/testing/bot-login-sc2/-/jobs/$CI_JOB_ID/artifacts/file/Report/Pictures/Page.png){{NewLine}}Refer [here](https://git3.nexdev.net/RnD/testing/bot-login-sc2/-/pipelines/$CI_PIPELINE_ID) for more detail{{NewLine}}________________" -d conversationId=-1001353358025 -d token=0A40aOc7CtpzjbBSJu8KNWQRoXyjRvf9  https://bot.nexdev.net/skynex/api/messages/forwardwithtoken
  when: on_failure
  
  
